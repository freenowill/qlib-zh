qlib_init:
    provider_uri: "/root/.qlib/qlib_data/cn_extra_data_h5"
    region: cn
market: &market all
benchmark: &benchmark SH000852
data_handler_config: &data_handler_config
    start_time: 2020-01-01
    end_time: 2026-05-12
    fit_start_time: 2020-01-01
    fit_end_time: 2024-05-12
    instruments: *market
    factor_config:
        direct: true
        # true = 预计算模式: 自动扫描 cn_extra_data/features/ 中所有 .day.bin 文件
        # 无需实时计算 Alpha158 表达式 (Kbar/Price/Rolling/Value/Quality/...)
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2022-01-01
        end_time: 2026-05-12
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: AlphaExtra
                module_path: qlib.contrib.data.handler_extra
                kwargs: *data_handler_config
            segments:
                train: [2020-01-01, 2023-05-12]
                valid: [2023-05-13, 2024-05-12]
                test: [2024-05-13, 2026-05-12]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
